[project]
name = "raglab"
version = "2.0.0"
description = "A hands-on course for learning Retrieval-Augmented Generation from first principles"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
    "openai>=1.40",
]

[project.optional-dependencies]
models = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0", "jupytext>=1.16"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

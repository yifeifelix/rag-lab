arkerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="abs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><rect x="1" y="1" width="898" height="398" rx="18" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/><text x="40" y="38" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="bold" fill="#1f2937"><tspan x="40" dy="0">Corrective RAG: check the cards before writing</tspan></text><rect x="40" y="60" width="150" height="44" rx="22" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="115" y="88" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2937"><tspan x="115" dy="0">❓ question</tspan></text><line x1="115" y1="108" x2="115" y2="134" stroke="#6b7280" stroke-width="2.5" marker-end="url(#am)"/><rect x="40" y="138" width="150" height="50" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="115" y="168" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#16a34a"><tspan x="115" dy="0">🧑‍💼 librarian</tspan></text><line x1="194" y1="163" x2="238" y2="163" stroke="#6b7280" stroke-width="2.5" marker-end="url(#am)"/><polygon points="320,118 400,163 320,208 240,163" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="320" y="160" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#7c3aed"><tspan x="320" dy="0">any card</tspan></text><text x="320" y="176" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#7c3aed"><tspan x="320" dy="0">helpful?</tspan></text><line x1="404" y1="163" x2="450" y2="163" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/><text x="427" y="150" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#16a34a"><tspan x="427" dy="0">yes</tspan></text><rect x="455" y="138" width="150" height="50" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="530" y="168" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#ea580c"><tspan x="530" dy="0">✍️ write answer</tspan></text><line x1="320" y1="212" x2="320" y2="250" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/><text x="334" y="236" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#dc2626"><tspan x="334" dy="0">no</tspan></text><rect x="235" y="254" width="170" height="50" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="320" y="284" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#dc2626"><tspan x="320" dy="0">✏️ rewrite question</tspan></text><path d="M 235 279 C 140 279, 115 250, 115 192" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/><text x="150" y="300" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#dc2626"><tspan x="150" dy="0">search again</tspan></text><rect x="455" y="254" width="150" height="50" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="530" y="284" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2937"><tspan x="530" dy="0">🤷 “I don’t know”</tspan></text><line x1="409" y1="279" x2="451" y2="279" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#am)"/><text x="430" y="320" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280"><tspan x="430" dy="0">still nothing on the 2nd try</tspan></text><text x="760" y="38" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#1f2937"><tspan x="760" dy="0">An agent decides for itself</tspan></text><text x="760" y="64" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280" font-style="italic"><tspan x="760" dy="0">like a detective following clues</tspan></text><rect x="790.0" y="112" width="100" height="36" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="840" y="135" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#2563eb"><tspan x="840" dy="0">🔍 search</tspan></text><rect x="617.0" y="112" width="126" height="36" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="680" y="135" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#2563eb"><tspan x="680" dy="0">📖 read results</tspan></text><rect x="710.0" y="232" width="100" height="36" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="760" y="255" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#2563eb"><tspan x="760" dy="0">🤔 think</tspan></text><line x1="785" y1="232" x2="825" y2="152" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ai)"/><line x1="788" y1="130" x2="747" y2="130" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ai)"/><line x1="700" y1="150" x2="736" y2="230" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ai)"/><line x1="760" y1="270" x2="760" y2="306" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/><rect x="670" y="310" width="180" height="36" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="760" y="334" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#16a34a"><tspan x="760" dy="0">✅ answer when ready</tspan></text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" width="900" height="390" role="img" aria-label="Multi-Query and HyDE improve the question before searching" style="max-width:100%;height:auto"><title>Multi-Query and HyDE improve the question before searching</title><defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ams" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ais" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ags" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ars" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="aos" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="abs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><rect x="1" y="1" width="898" height="388" rx="18" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/><text x="40" y="38" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="bold" fill="#1f2937"><tspan x="40" dy="0">Multi-Query: ask the question several ways, combine the results</tspan></text><rect x="40" y="70" width="190" height="70" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="135" y="98" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2937"><tspan x="135" dy="0">“make my script</tspan><tspan x="135" dy="18.2">stop for a bit”</tspan></text><line x1="234" y1="105" x2="280" y2="71" stroke="#6b7280" stroke-width="2.5" marker-end="url(#am)"/><rect x="285" y="58" width="230" height="26" rx="13" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="400" y="76" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#7c3aed"><tspan x="400" dy="0">time.sleep pause script</tspan></text><line x1="519" y1="71" x2="560" y2="71" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/><rect x="565" y="58" width="90" height="26" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="610" y="76" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#16a34a"><tspan x="610" dy="0">list A</tspan></text><line x1="234" y1="105" x2="280" y2="107" stroke="#6b7280" stroke-width="2.5" marker-end="url(#am)"/><rect x="285" y="94" width="230" height="26" rx="13" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="400" y="112" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#7c3aed"><tspan x="400" dy="0">delay execution seconds</tspan></text><line x1="519" y1="107" x2="560" y2="107" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/><rect x="565" y="94" width="90" height="26" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="610" y="112" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#16a34a"><tspan x="610" dy="0">list B</tspan></text><line x1="234" y1="105" x2="280" y2="143" stroke="#6b7280" stroke-width="2.5" marker-end="url(#am)"/><rect x="285" y="130" width="230" height="26" rx="13" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="400" y="148" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#7c3aed"><tspan x="400" dy="0">suspend program briefly</tspan></text><line x1="519" y1="143" x2="560" y2="143" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/><rect x="565" y="130" width="90" height="26" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="610" y="148" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#16a34a"><tspan x="610" dy="0">list C</tspan></text><line x1="659" y1="107" x2="705" y2="107" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/><rect x="710" y="80" width="160" height="54" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="790" y="104" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#16a34a"><tspan x="790" dy="0">RRF (Lesson 5)</tspan></text><text x="790" y="124" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2937"><tspan x="790" dy="0">→ best cards</tspan></text><text x="40" y="200" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="bold" fill="#1f2937"><tspan x="40" dy="0">HyDE: imagine an answer, then find real cards that look like it</tspan></text><rect x="40" y="226" width="190" height="70" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="135" y="254" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2937"><tspan x="135" dy="0">“make my script</tspan><tspan x="135" dy="18.2">stop for a bit”</tspan></text><line x1="234" y1="261" x2="280" y2="261" stroke="#ea580c" stroke-width="2.5" marker-end="url(#ao)"/><rect x="285" y="218" width="240" height="88" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2" stroke-dasharray="6 5"/><text x="405" y="242" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#ea580c"><tspan x="405" dy="0">✍️ pretend answer</tspan></text><text x="405" y="266" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2937" font-style="italic"><tspan x="405" dy="0">“Suspend execution for the</tspan><tspan x="405" dy="16.900000000000002">given number of seconds…”</tspan></text><line x1="529" y1="261" x2="575" y2="261" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/><text x="552" y="246" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#16a34a"><tspan x="552" dy="0">search</tspan></text><rect x="580" y="226" width="290" height="70" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="725" y="254" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#16a34a"><tspan x="725" dy="0">real card: time.sleep(secs) ✓</tspan></text><text x="725" y="278" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#6b7280"><tspan x="725" dy="0">only real cards are used</tspan></text><text x="405" y="328" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#6b7280" font-style="italic"><tspan x="405" dy="0">the pretend answer is never shown to the user</tspan></text><text x="40" y="368" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#6b7280" font-style="italic"><tspan x="40" dy="0">Like finding a lost dog by showing a photo of a similar-looking one.</tspan></text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" width="900" height="530" role="img" aria-label="Four ways to cut a document into cards" style="max-width:100%;height:auto"><title>Four ways to cut a document into cards</title><defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ams" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ais" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ags" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ars" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="aos" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="abs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><rect x="1" y="1" width="898" height="528" rx="18" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/><text x="40" y="40" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="bold" fill="#1f2937"><tspan x="40" dy="0">✂️  Fixed size – cut every N characters, without reading</tspan></text><rect x="40" y="54" width="830.0" height="34" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="50" y="77" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" text-anchor="start" font-weight="normal" fill="#1f2937"><tspan x="50" dy="0">use heappush to add an item while keeping the heap in order. heappop removes the smallest.</tspan></text><line x1="392.0" y1="48" x2="392.0" y2="96" stroke="#dc2626" stroke-width="3" stroke-dasharray="5 4"/><line x1="635.0" y1="48" x2="635.0" y2="96" stroke="#dc2626" stroke-width="3" stroke-dasharray="5 4"/><text x="392.0" y="112" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#dc2626"><tspan x="392.0" dy="0">cuts “keeping” in half ✗</tspan></text><text x="635.0" y="112" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#dc2626"><tspan x="635.0" dy="0">cuts “heappop” in half ✗</tspan></text><text x="40" y="150" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="bold" fill="#1f2937"><tspan x="40" dy="0">🧱  Overlap – neighbouring cards share a little text (like roof tiles)</tspan></text><rect x="40" y="166" width="230" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2" opacity="0.85"/><text x="155" y="192" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#2563eb"><tspan x="155" dy="0">card 1</tspan></text><rect x="220" y="172" width="230" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2" opacity="0.85"/><text x="335" y="198" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#16a34a"><tspan x="335" dy="0">card 2</tspan></text><rect x="400" y="178" width="230" height="40" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="2" opacity="0.85"/><text x="515" y="204" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#ea580c"><tspan x="515" dy="0">card 3</tspan></text><text x="245" y="242" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#6b7280"><tspan x="245" dy="0">shared part</tspan></text><text x="425" y="242" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#6b7280"><tspan x="425" dy="0">shared part</tspan></text><text x="670" y="194" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#6b7280"><tspan x="670" dy="0">A sentence cut at the edge</tspan></text><text x="670" y="212" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#6b7280"><tspan x="670" dy="0">of one card still appears</tspan></text><text x="670" y="230" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#16a34a"><tspan x="670" dy="0">whole in its neighbour ✓</tspan></text><text x="40" y="275" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="bold" fill="#1f2937"><tspan x="40" dy="0">📑  Recursive – cut where the author paused: headings, then paragraphs, then sentences</tspan></text><rect x="40" y="291" width="104" height="38" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="92.0" y="316" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2937"><tspan x="92.0" dy="0">## heapq</tspan></text><rect x="150" y="291" width="164" height="38" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="232.0" y="316" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2937"><tspan x="232.0" dy="0">paragraph</tspan></text><rect x="320" y="291" width="134" height="38" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="387.0" y="316" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2937"><tspan x="387.0" dy="0">paragraph</tspan></text><rect x="460" y="291" width="124" height="38" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="522.0" y="316" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2937"><tspan x="522.0" dy="0">## heappush</tspan></text><rect x="590" y="291" width="184" height="38" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="682.0" y="316" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2937"><tspan x="682.0" dy="0">paragraph</tspan></text><line x1="457" y1="283" x2="457" y2="337" stroke="#16a34a" stroke-width="3"/><text x="457" y="355" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#16a34a"><tspan x="457" dy="0">cut before the next heading ✓</tspan></text><text x="40" y="390" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="bold" fill="#1f2937"><tspan x="40" dy="0">🔍  Parent-child – search with a small card, give the writer its whole section</tspan></text><rect x="40" y="406" width="560" height="96" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="56" y="430" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#2563eb"><tspan x="56" dy="0">parent = the whole “## heappush” section  →  given to the writer</tspan></text><rect x="140" y="446" width="340" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="310" y="471" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#16a34a"><tspan x="310" dy="0">child = small card  →  used for searching</tspan></text><text x="630" y="440" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#1f2937"><tspan x="630" dy="0">Like a book index:</tspan></text><text x="630" y="462" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#6b7280"><tspan x="630" dy="0">look up one precise entry,</tspan><tspan x="630" dy="18.2">then read the whole page.</tspan></text></svg>

stem, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2937"><tspan x="765" dy="0">translate, summarise,</tspan><tspan x="765" dy="16.900000000000002">answer, chat</tspan></text><text x="765" y="194" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280" font-style="italic"><tspan x="765" dy="0">Lesson 7</tspan></text><path d="M 135 252 L 135 266 L 765 266 L 765 252" fill="none" stroke="#6b7280" stroke-width="2"/><path d="M 450 266 L 450 286" fill="none" stroke="#6b7280" stroke-width="2.5" marker-end="url(#am)"/><text x="470" y="282" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#6b7280" font-style="italic"><tspan x="470" dy="0">all built from the same ingredients</tspan></text><rect x="40" y="296" width="190" height="84" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="135" y="322" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#2563eb"><tspan x="135" dy="0">tokens</tspan></text><text x="135" y="344" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2937"><tspan x="135" dy="0">split text into pieces</tspan></text><text x="135" y="366" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280" font-style="italic"><tspan x="135" dy="0">Lessons 4, 12</tspan></text><rect x="250" y="296" width="190" height="84" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="345" y="322" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#2563eb"><tspan x="345" dy="0">embeddings</tspan></text><te
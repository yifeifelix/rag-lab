ice exam</tspan></text><text x="240" y="354" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#6b7280"><tspan x="240" dy="0">use it as often as you like while improving</tspan></text><rect x="470" y="306" width="400" height="60" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="670" y="332" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#dc2626"><tspan x="670" dy="0">🔒 Test set = final exam</tspan></text><text x="670" y="354" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#6b7280"><tspan x="670" dy="0">keep it locked; use it once, at the end</tspan></text></svg>

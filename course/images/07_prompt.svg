<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" width="900" height="490" role="img" aria-label="The writer receives rules, numbered cards and the question" style="max-width:100%;height:auto"><title>The writer receives rules, numbered cards and the question</title><defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ams" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ais" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ags" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ars" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="aos" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="abs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><rect x="1" y="1" width="898" height="488" rx="18" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/><text x="40" y="38" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="bold" fill="#1f2937"><tspan x="40" dy="0">What the writer actually receives – and nothing else</tspan></text><rect x="40" y="58" width="380" height="330" rx="12" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/><rect x="56" y="72" width="348" height="120" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="72" y="96" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#7c3aed"><tspan x="72" dy="0">RULES (system prompt)</tspan></text><text x="72" y="120" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2937"><tspan x="72" dy="0">• use ONLY the numbered cards</tspan><tspan x="72" dy="16.900000000000002">• add a footnote [n] to every fact</tspan><tspan x="72" dy="16.900000000000002">• not in the cards? say “I don’t know”</tspan></text><rect x="56" y="202" width="348" height="120" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="72" y="226" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#2563eb"><tspan x="72" dy="0">CARDS from the librarian</tspan></text><text x="72" y="252" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2937"><tspan x="72" dy="0">[1] random.sample(population, k) …</tspan></text><text x="72" y="274" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2937"><tspan x="72" dy="0">[2] random.choice(seq) …</tspan></text><text x="72" y="296" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2937"><tspan x="72" dy="0">[3] random.shuffle(x) …</tspan></text><rect x="56" y="332" width="348" height="44" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="72" y="360" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2937"><tspan x="72" dy="0">QUESTION: pick 3 different items from a list?</tspan></text><line x1="424" y1="220" x2="490" y2="220" stroke="#ea580c" stroke-width="2.5" marker-end="url(#ao)"/><rect x="495" y="180" width="150" height="80" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="570" y="214" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#ea580c"><tspan x="570" dy="0">✍️ writer</tspan></text><text x="570" y="238" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#6b7280"><tspan x="570" dy="0">(AI)</tspan></text><line x1="649" y1="220" x2="690" y2="220" stroke="#ea580c" stroke-width="2.5" marker-end="url(#ao)"/><rect x="695" y="180" width="175" height="80" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="782" y="210" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2937"><tspan x="782" dy="0">“Use random.sample</tspan></text><text x="782" y="230" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2937"><tspan x="782" dy="0">with k=3 [1]”</tspan></text><path d="M 782 264 C 782 300, 600 310, 410 254" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ag)"/><text x="600" y="316" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#16a34a"><tspan x="600" dy="0">the footnote lets you check the source</tspan></text><text x="490" y="352" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#1f2937"><tspan x="490" dy="0">Three classic traps</tspan></text><rect x="490" y="366" width="230" height="30" rx="15" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="605" y="386" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#dc2626"><tspan x="605" dy="0">🗂️  old versions</tspan></text><rect x="490" y="404" width="230" height="30" rx="15" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="605" y="424" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#dc2626"><tspan x="605" dy="0">🤷  no answer in cards</tspan></text><rect x="490" y="442" width="230" height="30" rx="15" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="605" y="462" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#dc2626"><tspan x="605" dy="0">🕵️  hidden instructions</tspan></text></svg>

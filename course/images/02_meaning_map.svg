<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Embeddings place text on a map of meaning" style="max-width:100%;height:auto"><title>Embeddings place text on a map of meaning</title><defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ams" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ais" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ags" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ars" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="aos" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="abs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><rect x="1" y="1" width="898" height="398" rx="18" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/><text x="40" y="38" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="bold" fill="#1f2937"><tspan x="40" dy="0">A map of meaning: similar meaning → nearby pins</tspan></text><line x1="70" y1="330" x2="70" y2="60" stroke="#6b7280" stroke-width="2.5" marker-end="url(#am)"/><line x1="70" y1="330" x2="470" y2="330" stroke="#6b7280" stroke-width="2.5" marker-end="url(#am)"/><text x="78" y="72" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#6b7280"><tspan x="78" dy="0">“animal-ness”</tspan></text><text x="468" y="354" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="end" font-weight="normal" fill="#6b7280"><tspan x="468" dy="0">“money-ness”</tspan></text><circle cx="120" cy="110" r="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="134" y="100" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#1f2937"><tspan x="134" dy="0">cat</tspan></text><circle cx="160" cy="135" r="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="174" y="125" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#1f2937"><tspan x="174" dy="0">kitten</tspan></text><circle cx="205" cy="105" r="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="219" y="95" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#1f2937"><tspan x="219" dy="0">dog</tspan></text><circle cx="400" cy="270" r="9" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="414" y="260" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#1f2937"><tspan x="414" dy="0">stock market</tspan></text><circle cx="360" cy="300" r="9" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="374" y="290" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#1f2937"><tspan x="374" dy="0">interest rate</tspan></text><text x="270" y="200" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#6b7280" font-style="italic"><tspan x="270" dy="0">far apart = unrelated</tspan></text><text x="520" y="38" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="bold" fill="#1f2937"><tspan x="520" dy="0">Cosine similarity: same direction?</tspan></text><line x1="580" y1="110" x2="648.4703320513664" y2="95.44618164275684" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/><line x1="580" y1="110" x2="623.3405914483697" y2="76.1386188570888" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/><circle cx="580" cy="110" r="3" fill="#1f2937" stroke="#1f2937" stroke-width="2"/><text x="670" y="106" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="bold" fill="#1f2937"><tspan x="670" dy="0">same direction</tspan></text><text x="670" y="128" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#16a34a"><tspan x="670" dy="0">score ≈ +1</tspan></text><line x1="580" y1="205" x2="650.0" y2="205.0" stroke="#6b7280" stroke-width="2.5" marker-end="url(#am)"/><line x1="580" y1="205" x2="580.0" y2="150.0" stroke="#6b7280" stroke-width="2.5" marker-end="url(#am)"/><circle cx="580" cy="205" r="3" fill="#1f2937" stroke="#1f2937" stroke-width="2"/><text x="670" y="201" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="bold" fill="#1f2937"><tspan x="670" dy="0">right angle</tspan></text><text x="670" y="223" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#6b7280"><tspan x="670" dy="0">score ≈ 0</tspan></text><line x1="580" y1="300" x2="645.7784834550135" y2="276.0585899672032" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/><line x1="580" y1="300" x2="528.3169058567751" y2="318.81110788291176" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/><circle cx="580" cy="300" r="3" fill="#1f2937" stroke="#1f2937" stroke-width="2"/><text x="670" y="296" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="bold" fill="#1f2937"><tspan x="670" dy="0">opposite</tspan></text><text x="670" y="318" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#dc2626"><tspan x="670" dy="0">score ≈ -1</tspan></text><text x="520" y="370" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#6b7280"><tspan x="520" dy="0">Real embeddings use 384 directions</tspan><tspan x="520" dy="16.900000000000002">instead of 2 – but the idea is the same.</tspan></text></svg>

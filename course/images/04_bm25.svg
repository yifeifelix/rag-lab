X="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="abs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><rect x="1" y="1" width="898" height="363" rx="18" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/><text x="40" y="38" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="bold" fill="#1f2937"><tspan x="40" dy="0">Idea 1 · Rare words are better clues (IDF)</tspan></text><text x="40" y="60" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#6b7280"><tspan x="40" dy="0">100 cards in the library</tspan></text><text x="40" y="110" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="bold" fill="#1f2937"><tspan x="40" dy="0">“return”</tspan></text><text x="40" y="128" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#6b7280"><tspan x="40" dy="0">on 90 cards</tspan></text><rect x="150" y="94" width="6.82" height="30" rx="5" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="164.82" y="115" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#1f2937"><tspan x="164.82" dy="0">0.11</tspan></text><text x="40" y="172" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="bold" fill="#1f2937"><tspan x="40" dy="0">“directory”</tspan></text><text x="40" y="190" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#6b7280"><tspan x="40" dy="0">on 10 cards</tspan><
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="900" height="370" role="img" aria-label="The library, the librarian and the writer" style="max-width:100%;height:auto"><title>The library, the librarian and the writer</title><defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ams" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ais" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ags" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ars" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="aos" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="abs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><rect x="1" y="1" width="898" height="368" rx="18" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/><rect x="250" y="22" width="400" height="46" rx="23" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="450" y="51" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="normal" fill="#1f2937"><tspan x="450" dy="0">❓ “How long do we keep exported data?”</tspan></text><rect x="40" y="110" width="240" height="160" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="160.0" y="142" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="bold" fill="#2563eb"><tspan x="160.0" dy="0">📚 The library</tspan></text><text x="160.0" y="172" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2937"><tspan x="160.0" dy="0">documents cut into</tspan><tspan x="160.0" dy="18.2">small cards,</tspan><tspan x="160.0" dy="18.2">prepared once, in advance</tspan></text><g transform="rotate(-8 130 240)"><rect x="110" y="222" width="40" height="28" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="2"/></g><g transform="rotate(0 160 240)"><rect x="140" y="218" width="40" height="28" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="2"/></g><g transform="rotate(8 190 240)"><rect x="170" y="224" width="40" height="28" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="2"/></g><rect x="330" y="110" width="240" height="160" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="450.0" y="142" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="bold" fill="#16a34a"><tspan x="450.0" dy="0">🧑‍💼 The librarian</tspan></text><text x="450.0" y="172" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2937"><tspan x="450.0" dy="0">finds the 5 cards most</tspan><tspan x="450.0" dy="18.2">likely to hold the answer,</tspan><tspan x="450.0" dy="18.2">for every question, fast</tspan></text><rect x="620" y="110" width="240" height="160" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="740.0" y="142" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="bold" fill="#ea580c"><tspan x="740.0" dy="0">✍️ The writer (AI)</tspan></text><text x="740.0" y="172" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2937"><tspan x="740.0" dy="0">reads only those cards,</tspan><tspan x="740.0" dy="18.2">writes the answer and</tspan><tspan x="740.0" dy="18.2">adds footnotes [1] [2]</tspan><tspan x="740.0" dy="18.2">or says “I don’t know”</tspan></text><line x1="450" y1="70" x2="450" y2="106" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ai)"/><line x1="284" y1="190" x2="326" y2="190" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)" marker-start="url(#ags)"/><text x="305" y="176" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#16a34a"><tspan x="305" dy="0">search</tspan></text><line x1="574" y1="190" x2="616" y2="190" stroke="#ea580c" stroke-width="2.5" marker-end="url(#ao)"/><text x="595" y="176" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#ea580c"><tspan x="595" dy="0">cards</tspan></text><line x1="740" y1="274" x2="740" y2="300" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ai)"/><rect x="560" y="304" width="300" height="42" rx="21" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="710" y="331" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#1f2937"><tspan x="710" dy="0">✅ “30 days [1]” – with a source</tspan></text><text x="40" y="332" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="bold" fill="#6b7280"><tspan x="40" dy="0">RAG = look it up first, then answer.</tspan></text></svg>

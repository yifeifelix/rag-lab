[project]
name = "enterprise-rag-platform"
version = "1.1.0"
description = "RAG learning and evaluation workbench with document lifecycle and synthetic concurrency experiments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.0",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "scikit-learn>=1.5.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
pretrained = ["sentence-transformers>=3.3.0"]

dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "locust>=2.31.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.setuptools.package-data]
rag_platform = ["static/*.html"]

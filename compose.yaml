name: raglab
services:
  lab:
    image: raglab:local
    build:
      context: docker
    init: false
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    restart: unless-stopped
    ports:
      - "${LAB_BIND_HOST:-0.0.0.0}:${LAB_PORT:-8888}:8888"
    environment:
      JUPYTER_TOKEN: "${JUPYTER_TOKEN:?run scripts/lab to create a token}"
      LLM_BASE_URL: "${LLM_BASE_URL:-http://host.docker.internal:8317/v1}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-}"
    volumes:
      - .:/home/lab/project
      - ./references:/home/lab/project/references:ro

  book:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${LAB_BIND_HOST:-0.0.0.0}:${BOOK_PORT:-8000}:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro

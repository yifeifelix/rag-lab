# REFERENCE ONLY: unvalidated historical topology, not a deployable production solution.
# Missing service/ingress, real image, persistent storage, secrets and distributed state integration.
# Kubernetes Production Deployment + KEDA/HPA Topology for 10,000 Concurrent Users
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-rag-gateway
  labels:
    app: enterprise-rag-gateway
    tier: tier-0
spec:
  replicas: 8
  selector:
    matchLabels:
      app: enterprise-rag-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 4
  template:
    metadata:
      labels:
        app: enterprise-rag-gateway
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: rag-gateway
          image: ghcr.io/enterprise-ai/rag-platform:1.0.0
          ports:
            - containerPort: 8000
          env:
            - name: RAG_LLM_MODE
              value: "openai"
            - name: REDIS_URL
              value: "redis://redis-cluster.rag.svc.cluster.local:6379/0"
            - name: QDRANT_URL
              value: "http://qdrant-cluster.rag.svc.cluster.local:6333"
          resources:
            requests:
              cpu: "4"
              memory: "8Gi"
            limits:
              cpu: "8"
              memory: "16Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: enterprise-rag-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: enterprise-rag-gateway
  minReplicas: 8
  maxReplicas: 48
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: enterprise-rag-pdb
spec:
  minAvailable: 75%
  selector:
    matchLabels:
      app: enterprise-rag-gateway
